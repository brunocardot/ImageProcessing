# =============================================================================
# imagep.ijm - Configuration File
# =============================================================================
# Lines starting with # are comments.
# Remove # to activate a setting.
# Boolean values: true or false
# When a var is set here it is locked (hidden from the dialog box).
# =============================================================================

# --- Mandala ---
#s04=false          # Enable 4-slice mandala
#sRP=1              # Repeat count (applies to 4-slice only)
#s08=false          # Enable 8-slice mandala
#s16=false          # Enable 16-slice mandala
#s32=false          # Enable 32-slice mandala
#s64=false          # Enable 64-slice mandala
#s128=false         # Enable 128-slice mandala
#sSep1=false        # Hide separator line after this section

# --- Drawing & Features ---
sDR=false           # Enable drawing mode
sDN=A               # Drawing variant to use: A or B
sMa=false           # Build a maze
sST=false           # Build a seamless tile
sIGP=false          # Build an Islamic Geometric Pattern
sIGPsq=false        # Add a square border around the Islamic Geometric Pattern tile
sSep2=false         # Hide separator line after this section

# --- Input ---
#sDi=false          # Process all files in a directory instead of a single file

# --- Output ---
#sSS=false          # Save the source (input) image
#sSD=false          # Save the destination (output) image
gDestinationDir=.\Temp  # Output folder for saved images
#sSep3=false        # Hide separator line after this section

# --- Options ---
#sCS=false          # Pause to allow manual change/move of the selection
#sRO=false          # Pre-rotate the image 90° before processing
#sDB1=false         # Debug: draw colored border around selection and number each slice
#sSM=false          # Silent mode: run without displaying intermediate images
#sSR=false          # Square output: crop result to square instead of circle
#sRM=Bilinear       # Interpolation method for rotations: Bilinear, Bicubic, or None
#sRR=false          # Reduce resolution to 1000x1000 before processing (speeds up large images)
#sLP=false          # Low speed mode: add a pause between each processing step
#sSep4=false        # Hide separator line after this section

